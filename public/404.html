<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Unifitz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Served by Vercel with HTTP 404 for any URL that isn't a real route
       (see vercel.json). Keep in sync with src/pages/NotFound.jsx. -->
  <style>
    :root { --ink:#20293A; --soft:#5B6472; --clay:#C2410C; --line:#F1E4D6; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px 16px; text-align:center; background:#FFF7ED; color:var(--ink);
      font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .brand { font:600 1.9rem Georgia,'Times New Roman',serif; color:var(--ink); text-decoration:none; margin-bottom:2rem; }
    .code { font:500 clamp(4rem,18vw,8rem)/1 Georgia,serif; color:var(--clay); margin:0; }
    h1 { font:500 clamp(1.6rem,1.2rem + 1.5vw,2.2rem)/1.15 Georgia,serif; margin:.75rem 0 0; }
    p { color:var(--soft); max-width:24rem; margin:.75rem auto 0; }
    .row { margin-top:2rem; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    a.btn { display:inline-flex; align-items:center; min-height:48px; padding:.8rem 1.5rem; border-radius:999px;
      font-weight:700; text-decoration:none; border:1.5px solid var(--clay); color:var(--clay); background:#fff; }
    a.btn:hover { background:var(--clay); color:#fff; }
    a.ghost { border-color:var(--line); color:var(--ink); }
    a:focus-visible { outline:3px solid var(--clay); outline-offset:2px; }
  </style>
</head>
<body>
  <a class="brand" href="/">Unifitz</a>
  <p class="code">404</p>
  <h1>This page took a rest day.</h1>
  <p>The page you’re looking for doesn’t exist or has moved.</p>
  <div class="row">
    <a class="btn" href="/">Go home</a>
    <a class="btn ghost" href="/#timetable">See this week’s classes</a>
  </div>
</body>
</html>
